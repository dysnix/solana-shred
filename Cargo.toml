[package]
name = "solana-shred"
version = "2.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Pinned Jito shred parsing, Merkle FEC recovery, and deshredding without ledger storage"
repository = "https://github.com/dysnix/solana-shred"
homepage = "https://github.com/dysnix/solana-shred"
readme = "README.md"
keywords = ["solana", "shred", "fec", "reed-solomon", "deshred"]
categories = ["network-programming", "encoding"]

[dependencies]
assert_matches = "1.5.0"
bincode = "1.3.3"
bitflags = { version = "2.8.0", features = ["serde"] }
itertools = "0.12.1"
lazy-lru = "0.1.3"
lazy_static = "1.5.0"
log = "0.4"
num_enum = "0.7.3"
rand = "0.8.5"
rayon = "1.10.0"
reed-solomon-erasure = { version = "6.0.0", features = ["simd-accel"] }
serde = { version = "1.0.217", features = ["derive"] }
solana-entry = "=2.2.0"
solana-measure = "=2.2.0"
solana-metrics = "=2.2.0"
solana-perf = "=2.2.0"
solana-rayon-threadlimit = "=2.2.0"
solana-sdk = "=2.2.1"
static_assertions = "1.1.0"
thiserror = "2.0.11"

[dev-dependencies]
bs58 = "0.5.1"
rand_chacha = "0.3.1"
solana-logger = "2.2.1"
test-case = "3.3.1"
